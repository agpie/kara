<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    #lyric { width: 640px; max-width: 100%; aspect-ratio: 16/9; background: #000; }
    #instHost {
      position: fixed; left: 0; bottom: 0;
      width: 200px; height: 112px;
      opacity: 0.001; pointer-events: none; z-index: -1;
    }
    button { font: inherit; padding: 8px 14px; margin-right: 6px; }
    #readout { font-family: monospace; margin-top: 12px; white-space: pre; }
    .nudge { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Karaoke</h1>
  <div id="lyric"></div>

  <p>
    <button id="startBtn" disabled>Start song</button>
    <button id="pauseBtn">Pause</button>
    <button id="stopBtn">Stop</button>
  </p>

  <div class="nudge">
    Lyrics:
    <button data-n="-0.5">−0.5s</button>
    <button data-n="-0.1">−0.1s</button>
    <button data-n="0.1">+0.1s</button>
    <button data-n="0.5">+0.5s</button>
  </div>

  <div id="readout">loading…</div>
  <div id="instHost"><div id="inst"></div></div>

  <script>
    var SONGS = [
      {
        title: 'Polaroid Love',
        lyricId: 'zVg4HIFVQ2U',
        lyricStart: 2.0,
        instId: '7PvV7EgO__0',
        instStart: 0.5
      }
    ];

    var LOCK_TOL = 0.10;   // tight, while the song settles
    var RUN_TOL  = 0.28;   // looser once running
    var LOCK_MS  = 5000;

    var song = SONGS[0];
    var lyric = null, inst = null;
    var ready = { lyric: false, inst: false };
    var playing = false, nudge = 0, startedAt = 0, timer = null;

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      var vars = {
        controls: 0, disablekb: 1, rel: 0, fs: 0,
        modestbranding: 1, iv_load_policy: 3,
        playsinline: 1, origin: location.origin
      };
      lyric = new YT.Player('lyric', {
        playerVars: vars,
        events: {
          onReady: function () { lyric.mute(); markReady('lyric'); },
          onError: function (e) { fail('lyric', e.data); }
        }
      });
      inst = new YT.Player('inst', {
        playerVars: vars,
        events: {
          onReady: function () { inst.unMute(); inst.setVolume(80); markReady('inst'); },
          onStateChange: onInstState,
          onError: function (e) { fail('inst', e.data); }
        }
      });
    }

    function markReady(w) {
      ready[w] = true;
      if (ready.lyric && ready.inst) {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('readout').textContent = 'ready';
      }
    }
    function fail(w, code) {
      document.getElementById('readout').textContent = w + ' failed: error ' + code;
    }

    // The instrumental leads; the lyric video follows whatever it does.
    function onInstState(e) {
      if (!playing || !ready.lyric) return;
      var S = YT.PlayerState;
      if (e.data === S.PLAYING) lyric.playVideo();
      else if (e.data === S.PAUSED || e.data === S.BUFFERING) lyric.pauseVideo();
      else if (e.data === S.ENDED) stop();
    }

    function start() {
      nudge = 0;
      lyric.loadVideoById({ videoId: song.lyricId, startSeconds: song.lyricStart });
      inst.loadVideoById({ videoId: song.instId,  startSeconds: song.instStart  });
      playing = true;
      startedAt = performance.now();
      clearInterval(timer);
      timer = setInterval(tick, 350);
    }

    function stop() {
      playing = false;
      clearInterval(timer);
      timer = null;
      try { inst.stopVideo(); lyric.stopVideo(); } catch (err) {}
    }

    function tick() {
      if (!playing) return;
      var it, lt;
      try { it = inst.getCurrentTime(); lt = lyric.getCurrentTime(); }
      catch (err) { return; }

      var elapsed = it - song.instStart;          // seconds into the song
      if (elapsed < -1) return;                   // instrumental hasn't reached its start
      var target = song.lyricStart + nudge + elapsed;
      if (target < 0) return;

      var drift = lt - target;
      var tol = (performance.now() - startedAt < LOCK_MS) ? LOCK_TOL : RUN_TOL;

      var corrected = false;
      if (Math.abs(drift) > tol && inst.getPlayerState() === YT.PlayerState.PLAYING) {
        lyric.seekTo(target, true);
        corrected = true;
      }

      document.getElementById('readout').textContent =
        'song position  ' + elapsed.toFixed(2) + 's\n' +
        'lyricStart     ' + (song.lyricStart + nudge).toFixed(2) + 's\n' +
        'drift          ' + (drift >= 0 ? '+' : '') + drift.toFixed(2) + 's' +
        (corrected ? '  <- corrected' : '');
    }

    document.getElementById('startBtn').onclick = start;
    document.getElementById('stopBtn').onclick = stop;
    document.getElementById('pauseBtn').onclick = function () {
      if (!playing) return;
      if (inst.getPlayerState() === YT.PlayerState.PLAYING) inst.pauseVideo();
      else inst.playVideo();
    };

    document.querySelector('.nudge').addEventListener('click', function (e) {
      var n = e.target.dataset.n;
      if (!n || !playing) return;
      nudge += parseFloat(n);
      // jump the lyric video immediately rather than waiting for the next tick
      try {
        lyric.seekTo(song.lyricStart + nudge + (inst.getCurrentTime() - song.instStart), true);
      } catch (err) {}
    });
  </script>
</body>
</html>
