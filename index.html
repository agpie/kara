<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    #lyric { width: 640px; max-width: 100%; aspect-ratio: 16/9; background: #000; }

    /* The instrumental. On-screen, but invisible. See note below. */
    #instHost {
      position: fixed; left: 0; bottom: 0;
      width: 200px; height: 112px;
      opacity: 0.001;
      pointer-events: none;
      z-index: -1;
    }
    button { font: inherit; padding: 8px 14px; margin-right: 6px; }
    #readout { font-family: monospace; margin-top: 12px; white-space: pre; }
  </style>
</head>
<body>
  <h1>Karaoke</h1>

  <div id="lyric"></div>

  <p>
    <button id="startBtn" disabled>Start both</button>
    <button id="stopBtn">Stop both</button>
  </p>
  <div id="readout">loading…</div>

  <div id="instHost"><div id="inst"></div></div>

  <script>
    var LYRIC_ID = 'dQw4w9WgXcQ';   // seen, muted
    var INST_ID  = 'M84fFXooS5w';  // heard, hidden — any second video for now

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var lyric = null, inst = null;
    var ready = { lyric: false, inst: false };

    function onYouTubeIframeAPIReady() {
      var vars = {
        controls: 0, disablekb: 1, rel: 0, fs: 0,
        modestbranding: 1, iv_load_policy: 3,
        playsinline: 1, origin: location.origin
      };

      lyric = new YT.Player('lyric', {
        videoId: LYRIC_ID,
        playerVars: vars,
        events: {
          onReady: function () { lyric.mute(); markReady('lyric'); },
          onError: function (e) { fail('lyric', e.data); }
        }
      });

      inst = new YT.Player('inst', {
        videoId: INST_ID,
        playerVars: vars,
        events: {
          onReady: function () { inst.unMute(); inst.setVolume(80); markReady('inst'); },
          onError: function (e) { fail('inst', e.data); }
        }
      });
    }

    function markReady(which) {
      ready[which] = true;
      if (ready.lyric && ready.inst) document.getElementById('startBtn').disabled = false;
    }
    function fail(which, code) {
      document.getElementById('readout').textContent = which + ' failed: error ' + code;
    }

    // Both play calls happen inside the click, which is what satisfies
    // the browser's autoplay rules for the unmuted instrumental.
    document.getElementById('startBtn').onclick = function () {
      lyric.playVideo();
      inst.playVideo();
    };
    document.getElementById('stopBtn').onclick = function () {
      lyric.stopVideo();
      inst.stopVideo();
    };

    setInterval(function () {
      if (!ready.lyric || !ready.inst) return;
      var l = lyric.getCurrentTime(), i = inst.getCurrentTime();
      document.getElementById('readout').textContent =
        'lyric ' + l.toFixed(2) + 's\n' +
        'inst  ' + i.toFixed(2) + 's\n' +
        'gap   ' + (l - i).toFixed(2) + 's';
    }, 200);
  </script>
</body>
</html>
