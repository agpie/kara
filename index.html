<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    #lyric { width: 640px; max-width: 100%; aspect-ratio: 16/9; background: #000; }
    #instHost {
      position: fixed; left: 0; bottom: 0;
      width: 200px; height: 112px;
      opacity: 0.001; pointer-events: none; z-index: -1;
    }
    button { font: inherit; padding: 8px 14px; margin-right: 6px; }
    #readout { font-family: monospace; margin-top: 12px; white-space: pre; }
  </style>
</head>
<body>
  <h1>Karaoke</h1>
  <div id="lyric"></div>

  <p>
    <button id="startBtn" disabled>Start song</button>
    <button id="stopBtn">Stop</button>
  </p>
  <div id="readout">loading…</div>

  <div id="instHost"><div id="inst"></div></div>

  <script>
    // lyricStart / instStart = seconds into each video where the SAME
    // moment of the song happens. Pick one unmistakable landmark and
    // use it for both - the first sung word is the easiest.
    var SONGS = [
      {
        title: 'Polaroid Love',
        lyricId: 'zVg4HIFVQ2U',
        lyricStart: 0.5,
        instId: '7PvV7EgO__0',
        instStart: 0.5
      }
    ];

    var song = SONGS[0];

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    var lyric = null, inst = null;
    var ready = { lyric: false, inst: false };
    var playing = false;

    function onYouTubeIframeAPIReady() {
      var vars = {
        controls: 0, disablekb: 1, rel: 0, fs: 0,
        modestbranding: 1, iv_load_policy: 3,
        playsinline: 1, origin: location.origin
      };
      lyric = new YT.Player('lyric', {
        playerVars: vars,
        events: {
          onReady: function () { lyric.mute(); markReady('lyric'); },
          onError: function (e) { fail('lyric', e.data); }
        }
      });
      inst = new YT.Player('inst', {
        playerVars: vars,
        events: {
          onReady: function () { inst.unMute(); inst.setVolume(80); markReady('inst'); },
          onError: function (e) { fail('inst', e.data); }
        }
      });
    }

    function markReady(which) {
      ready[which] = true;
      if (ready.lyric && ready.inst) {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('readout').textContent = 'ready';
      }
    }
    function fail(which, code) {
      document.getElementById('readout').textContent = which + ' failed: error ' + code;
    }

    document.getElementById('startBtn').onclick = function () {
      // Each player loads AND seeks in one go, so it buffers from the
      // right place instead of loading at 0 and jumping.
      lyric.loadVideoById({ videoId: song.lyricId, startSeconds: song.lyricStart });
      inst.loadVideoById({ videoId: song.instId,  startSeconds: song.instStart  });
      playing = true;
    };
    document.getElementById('stopBtn').onclick = function () {
      playing = false;
      lyric.stopVideo();
      inst.stopVideo();
    };

    setInterval(function () {
      if (!playing || !ready.lyric || !ready.inst) return;

      // Convert both players' clocks into "seconds into the song".
      var songTimeLyric = lyric.getCurrentTime() - song.lyricStart;
      var songTimeInst  = inst.getCurrentTime()  - song.instStart;
      var error = songTimeLyric - songTimeInst;

      document.getElementById('readout').textContent =
        'song position (from inst) ' + songTimeInst.toFixed(2) + 's\n' +
        'alignment error           ' + (error >= 0 ? '+' : '') + error.toFixed(2) + 's\n' +
        (error > 0.15 ? 'lyrics are AHEAD - raise instStart or lower lyricStart'
       : error < -0.15 ? 'lyrics are BEHIND - lower instStart or raise lyricStart'
       : 'aligned');
    }, 200);
  </script>
</body>
</html>
