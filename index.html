<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; margin: 0;
      background: #14142c; color: #eceafa;
    }
    h1 { font-size: 20px; margin: 0; padding: 14px 20px; background: #0b0b1c; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em;
         color: #9a97c4; margin: 0 0 10px; }

    .room { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; padding: 20px; }
    .panel { min-width: 0; }

    #screen { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden; }
    #screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #shield { position: absolute; inset: 0; }
    #idle { position: absolute; inset: 0; display: grid; place-content: center;
            text-align: center; color: #6f6c9c; font-size: 15px; padding: 20px; }
    #screen:fullscreen { aspect-ratio: auto; width: 100%; height: 100%; border-radius: 0; }

    #osd {
      position: absolute; left: 20px; bottom: 20px; max-width: 70%;
      padding: 10px 16px; background: rgba(11,11,28,.82); border-radius: 4px;
      font-size: 18px; font-weight: 600;
      opacity: 0; transition: opacity .4s; pointer-events: none;
    }
    #osd.show { opacity: 1; }
    #osd .sub { font-size: 13px; font-weight: 400; color: #9a97c4; margin-top: 2px; }

    #nowTitle { font-size: 22px; font-weight: 600; margin: 14px 0 2px; }
    #nowArtist { color: #9a97c4; font-size: 14px; margin: 0 0 12px; }

    button { font: inherit; padding: 9px 14px; margin: 0 6px 6px 0;
             background: #262452; color: #eceafa; border: 1px solid #3a3770;
             border-radius: 3px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: #7b78d0; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .danger { border-color: #a33; color: #ff9a9a; }

    .vol { display: inline-flex; align-items: center; gap: 8px; margin: 0 6px 6px 0;
           padding: 8px 12px; border: 1px solid #3a3770; border-radius: 3px; }
    .vol label { font-size: 13px; color: #9a97c4; }
    .vol input { width: 110px; accent-color: #7b78d0; }
    .vol .val { font-family: ui-monospace, monospace; font-size: 12px;
                color: #9a97c4; width: 2.2em; text-align: right; }

    #tuneBtn.is-open { border-color: #7b78d0; color: #cfcdf5; }
    #tuner { margin-top: 12px; padding: 12px; background: #0b0b1c; border-radius: 4px; }
    #tuner button { padding: 6px 10px; font-size: 13px; }
    #readout { font-family: ui-monospace, monospace; font-size: 12px;
               white-space: pre; color: #9a97c4; margin-top: 8px; }

    #keyhelp { color: #6f6c9c; font-size: 12px; margin-top: 12px; line-height: 2; }
    kbd { font-family: ui-monospace, monospace; font-size: 11px; background: #262452;
          border: 1px solid #3a3770; border-radius: 3px; padding: 1px 5px; }

    #queue { list-style: none; padding: 0; margin: 0; }
    #queue li { display: flex; align-items: center; gap: 8px;
                padding: 9px 0; border-bottom: 1px solid #2a2850; }
    #queue .pos { font-family: ui-monospace, monospace; color: #6f6c9c; width: 1.8em; }
    #queue .name { flex: 1; min-width: 0; }
    #queue .artist { color: #9a97c4; font-size: 13px; }
    #queue button { padding: 3px 9px; margin: 0; font-size: 13px; }
    #queueEmpty { color: #6f6c9c; font-size: 14px; }

    #search {
      width: 100%; margin-bottom: 10px; padding: 9px 12px;
      background: #0b0b1c; color: #eceafa;
      border: 1px solid #3a3770; border-radius: 3px; font: inherit;
    }
    #search::placeholder { color: #6f6c9c; }
    #noMatch { color: #6f6c9c; font-size: 14px; }

    #list { list-style: none; padding: 0; margin: 0; max-height: 70vh; overflow-y: auto; }
    #list button { display: block; width: 100%; text-align: left; margin: 0 0 6px; }
    #list .artist { color: #9a97c4; font-size: 13px; }

    #instHost { position: fixed; left: 0; bottom: 0; width: 200px; height: 112px;
                opacity: .001; pointer-events: none; z-index: -1; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .room { grid-template-columns: 1fr; }
      #list { max-height: none; }
      #keyhelp { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { #osd { transition: none; } }
  </style>
</head>
<body>
  <h1>Karaoke</h1>

  <div class="room">
    <!-- MAIN: what's playing, and what's next -->
    <section class="panel">
      <div id="screen">
        <div id="lyric"></div>
        <div id="shield"></div>
        <div id="idle">Pick a song from the list to start</div>
        <div id="osd"></div>
      </div>

      <div id="nowTitle">Nothing playing</div>
      <div id="nowArtist"></div>

      <div>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="skipBtn" disabled>Skip</button>
        <button id="stopBtn" class="danger" disabled>Stop</button>
        <span class="vol">
          <label for="vol">Backing</label>
          <input id="vol" type="range" min="0" max="100" value="80">
          <span class="val" id="volVal">80</span>
        </span>
        <button id="tuneBtn">Tune</button>
        <button id="fsBtn">Fullscreen</button>
        <button id="resume" hidden>Tap to start the song</button>
      </div>

      <div id="tuner" hidden>
        Lyrics:
        <button class="nudge" data-n="-0.5">−0.5s</button>
        <button class="nudge" data-n="-0.1">−0.1s</button>
        <button class="nudge" data-n="0.1">+0.1s</button>
        <button class="nudge" data-n="0.5">+0.5s</button>
        <button id="copyBtn">Copy songbook</button>
        <div id="readout"></div>
      </div>

      <div id="keyhelp">
        <kbd>space</kbd> pause · <kbd>N</kbd> skip · <kbd>esc</kbd> stop ·
        <kbd>↑</kbd> <kbd>↓</kbd> volume · <kbd>T</kbd> tune ·
        <kbd>[</kbd> <kbd>]</kbd> nudge lyrics · <kbd>F</kbd> fullscreen ·
        <kbd>/</kbd> search
      </div>

      <h2 style="margin-top:24px">Up next</h2>
      <p id="queueEmpty">Nothing queued.</p>
      <ol id="queue"></ol>
      <button id="clearBtn" hidden>Clear queue</button>
    </section>

    <!-- SIDE: the songbook -->
    <aside class="panel">
      <h2>Songs</h2>
      <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
      <p id="loading">loading…</p>
      <p id="noMatch" hidden>No songs match that.</p>
      <ul id="list"></ul>
    </aside>
  </div>

  <div id="instHost"><div id="inst"></div></div>

  <script src="songs.js"></script>
  <script>
    var LOCK_TOL = 0.10, RUN_TOL = 0.28, LOCK_MS = 5000;

    // Queue lives for the tab (survives refresh, gone tomorrow).
    // Volume is a preference, so it sticks.
    var QUEUE_KEY = 'karaoke.queue';
    var VOL_KEY   = 'karaoke.volume';

    var lyric = null, inst = null;
    var ready = { lyric: false, inst: false };
    var current = null, nudge = 0, startedAt = 0, timer = null, watchdog = null;
    var queue = [], uidSeq = 0, restored = false;

    var $ = function (id) { return document.getElementById(id); };

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      var vars = {
        controls: 0, disablekb: 1, rel: 0, fs: 0,
        modestbranding: 1, iv_load_policy: 3,
        playsinline: 1, origin: location.origin
      };
      lyric = new YT.Player('lyric', {
        playerVars: vars,
        events: {
          onReady: function () { lyric.mute(); markReady('lyric'); },
          onError: function (e) { fail('lyric', e.data); }
        }
      });
      inst = new YT.Player('inst', {
        playerVars: vars,
        events: {
          onReady: function () { inst.unMute(); inst.setVolume(+$('vol').value); markReady('inst'); },
          onStateChange: onInstState,
          onError: function (e) { fail('inst', e.data); }
        }
      });
    }

    function markReady(w) {
      ready[w] = true;
      if (!ready.lyric || !ready.inst) return;
      $('loading').hidden = true;
      drawList();
      drawQueue();
      // Only now is it safe to offer Skip - play() bails if the players aren't up.
      $('skipBtn').disabled = queue.length === 0;
      if (restored && queue.length) {
        $('idle').textContent = 'Queue restored from before the refresh. Press Skip to start.';
      }
    }
    function fail(w, code) {
      $('readout').textContent = w + ' video failed: error ' + code +
        (code === 101 || code === 150 ? ' (embedding disabled - use a different upload)' : '');
      $('tuner').hidden = false;
    }

    /* ---------- persistence ---------- */
    // Songs have no ids, so identify them by their two video ids.
    function songKey(s) { return s.lyricId + '|' + s.instId; }

    function saveQueue() {
      try {
        // The song playing right now goes back on the front, so a refresh
        // mid-song leaves it as the next thing up rather than losing it.
        var pending = (current ? [current] : []).concat(
          queue.map(function (item) { return item.song; })
        );
        sessionStorage.setItem(QUEUE_KEY, JSON.stringify(pending.map(songKey)));
      } catch (err) {}   // private mode, storage full - not worth interrupting anyone over
    }

    function restoreQueue() {
      var raw = null;
      try { raw = sessionStorage.getItem(QUEUE_KEY); } catch (err) { return; }
      if (!raw) return;

      var keys;
      try { keys = JSON.parse(raw); } catch (err) { return; }
      if (!Array.isArray(keys)) return;

      var index = {};
      SONGS.forEach(function (s) { index[songKey(s)] = s; });

      keys.forEach(function (k) {
        var song = index[k];
        if (song) queue.push({ uid: ++uidSeq, song: song });   // silently drop songs since removed
      });
      restored = queue.length > 0;
    }

    /* ---------- songbook ---------- */
    function drawList() {
      var q = $('search').value.trim().toLowerCase();
      var el = $('list');
      el.innerHTML = '';

      var matches = SONGS.filter(function (song) {
        if (!q) return true;
        return (song.title + ' ' + (song.artist || '')).toLowerCase().indexOf(q) !== -1;
      });

      $('noMatch').hidden = matches.length > 0;

      matches.forEach(function (song) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.innerHTML = '<strong>' + song.title + '</strong>' +
                      '<div class="artist">' + (song.artist || '') + '</div>';
        b.onclick = function () { enqueue(song); };
        li.appendChild(b);
        el.appendChild(li);
      });
    }

    /* ---------- queue ---------- */
    // Every pick goes on the queue. If nothing is playing, this click is also
    // the user gesture that lets the unmuted backing track start.
    function enqueue(song) {
      queue.push({ uid: ++uidSeq, song: song });
      if (!current) advance();
      else drawQueue();
    }

    // Every queue mutation ends up here, so this is where the save belongs.
    function drawQueue() {
      var el = $('queue');
      el.innerHTML = '';
      $('queueEmpty').hidden = queue.length > 0;
      $('clearBtn').hidden = queue.length === 0;

      queue.forEach(function (item, i) {
        var li = document.createElement('li');

        var pos = document.createElement('span');
        pos.className = 'pos';
        pos.textContent = (i + 1) + '.';

        var name = document.createElement('span');
        name.className = 'name';
        name.innerHTML = '<strong>' + item.song.title + '</strong>' +
                         '<div class="artist">' + (item.song.artist || '') + '</div>';

        var up = document.createElement('button');
        up.textContent = '↑';
        up.disabled = (i === 0);
        up.onclick = function () { queue.splice(i - 1, 0, queue.splice(i, 1)[0]); drawQueue(); };

        var rm = document.createElement('button');
        rm.textContent = '✕';
        rm.onclick = function () { queue.splice(i, 1); drawQueue(); };

        li.appendChild(pos); li.appendChild(name); li.appendChild(up); li.appendChild(rm);
        el.appendChild(li);
      });

      saveQueue();
    }

    function advance() {
      var item = queue.shift();
      if (!item) { stop(); return; }
      play(item.song);
      drawQueue();
    }

    /* ---------- playback ---------- */
    function onInstState(e) {
      if (!current || !ready.lyric) return;
      var S = YT.PlayerState;
      if (e.data === S.PLAYING) { lyric.playVideo(); $('resume').hidden = true; }
      else if (e.data === S.PAUSED || e.data === S.BUFFERING) lyric.pauseVideo();
      else if (e.data === S.ENDED) advance();
      $('pauseBtn').textContent = (e.data === S.PAUSED) ? 'Resume' : 'Pause';
    }

    function play(song) {
      if (!ready.lyric || !ready.inst) return;
      current = song;
      nudge = 0;
      restored = false;
      $('idle').hidden = true;
      $('nowTitle').textContent = song.title;
      $('nowArtist').textContent = song.artist || '';
      $('pauseBtn').disabled = false;
      $('skipBtn').disabled = false;
      $('stopBtn').disabled = false;
      $('resume').hidden = true;

      inst.setVolume(+$('vol').value);
      closeTuner();
      showOsd(song.title, song.artist || '');

      lyric.loadVideoById({ videoId: song.lyricId, startSeconds: Math.max(0, song.lyricStart) });
      inst.loadVideoById({ videoId: song.instId,  startSeconds: Math.max(0, song.instStart)  });

      startedAt = performance.now();
      clearInterval(timer);
      timer = setInterval(tick, 350);

      clearTimeout(watchdog);
      watchdog = setTimeout(function () {
        if (!current) return;
        var s = inst.getPlayerState();
        if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) $('resume').hidden = false;
      }, 2500);
    }

    // Stops playback. Leaves the queue alone - that's what Clear queue is for.
    function stop() {
      clearInterval(timer); timer = null;
      clearTimeout(watchdog);
      current = null;                    // set BEFORE stopVideo, so the ENDED it fires is ignored
      try { inst.stopVideo(); lyric.stopVideo(); } catch (err) {}
      $('idle').hidden = false;
      $('idle').textContent = queue.length ? 'Stopped. Press Skip to play the next song.'
                                           : 'Pick a song from the list to start';
      $('nowTitle').textContent = 'Nothing playing';
      $('nowArtist').textContent = '';
      $('pauseBtn').disabled = true;
      $('pauseBtn').textContent = 'Pause';
      $('stopBtn').disabled = true;
      $('skipBtn').disabled = queue.length === 0;
      $('resume').hidden = true;
      $('readout').textContent = '';
      drawQueue();
    }

    function tick() {
      if (!current) return;
      var it, lt;
      try { it = inst.getCurrentTime(); lt = lyric.getCurrentTime(); }
      catch (err) { return; }

      if (current.end && it >= current.end) { advance(); return; }

      var elapsed = it - current.instStart;
      if (elapsed < -1) return;
      var target = current.lyricStart + nudge + elapsed;
      if (target < 0) return;

      var drift = lt - target;
      var tol = (performance.now() - startedAt < LOCK_MS) ? LOCK_TOL : RUN_TOL;
      if (Math.abs(drift) > tol && inst.getPlayerState() === YT.PlayerState.PLAYING) {
        lyric.seekTo(target, true);
      }

      $('readout').textContent =
        'position  ' + elapsed.toFixed(2) + 's   ' +
        'lyricStart ' + (current.lyricStart + nudge).toFixed(2) + 's   ' +
        'drift ' + (drift >= 0 ? '+' : '') + drift.toFixed(2) + 's';
    }

    /* ---------- shared actions ---------- */
    function togglePause() {
      if (!current) return;
      if (inst.getPlayerState() === YT.PlayerState.PLAYING) inst.pauseVideo();
      else inst.playVideo();
    }

    function applyNudge(delta) {
      if (!current) return;
      nudge += delta;
      try {
        lyric.seekTo(current.lyricStart + nudge + (inst.getCurrentTime() - current.instStart), true);
      } catch (err) {}
    }

    function setVolume(v) {
      v = Math.max(0, Math.min(100, Math.round(v)));
      $('vol').value = v;
      $('volVal').textContent = v;
      if (ready.inst) inst.setVolume(v);
      try { localStorage.setItem(VOL_KEY, v); } catch (err) {}
    }

    function closeTuner() {
      $('tuner').hidden = true;
      $('tuneBtn').classList.remove('is-open');
    }

    // In fullscreen the video covers the page, so flash the title on screen.
    function showOsd(title, sub) {
      $('osd').innerHTML = '<div>' + title + '</div>' +
                           (sub ? '<div class="sub">' + sub + '</div>' : '');
      $('osd').classList.add('show');
      clearTimeout(showOsd.t);
      showOsd.t = setTimeout(function () { $('osd').classList.remove('show'); }, 4000);
    }

    function toggleFullscreen() {
      var el = $('screen');
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    }

    /* ---------- controls ---------- */
    $('pauseBtn').onclick = togglePause;
    $('skipBtn').onclick = advance;
    $('stopBtn').onclick = stop;
    $('fsBtn').onclick = toggleFullscreen;
    $('clearBtn').onclick = function () { queue = []; drawQueue(); };
    $('resume').onclick = function () { $('resume').hidden = true; inst.playVideo(); };
    $('vol').oninput = function () { setVolume(+this.value); };

    $('search').oninput = drawList;
    $('search').onkeydown = function (e) {
      if (e.key === 'Escape') { this.value = ''; drawList(); this.blur(); }
    };

    $('tuneBtn').onclick = function () {
      var open = $('tuner').hidden;
      $('tuner').hidden = !open;
      $('tuneBtn').classList.toggle('is-open', open);
    };

    document.addEventListener('fullscreenchange', function () {
      $('fsBtn').textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
    });

    document.querySelectorAll('.nudge').forEach(function (b) {
      b.onclick = function () { applyNudge(parseFloat(b.dataset.n)); };
    });

    $('copyBtn').onclick = function () {
      if (current) { current.lyricStart = +(current.lyricStart + nudge).toFixed(2); nudge = 0; }
      var text = 'var SONGS = ' + JSON.stringify(SONGS, null, 2) + ';';
      navigator.clipboard.writeText(text).then(
        function () { $('copyBtn').textContent = 'Copied'; },
        function () { window.prompt('Copy this:', text); }
      );
      setTimeout(function () { $('copyBtn').textContent = 'Copy songbook'; }, 2000);
    };

    document.addEventListener('keydown', function (e) {
      // Don't hijack keys while the slider or a text field has focus.
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      switch (e.key) {
        case ' ':           e.preventDefault(); togglePause(); break;
        case 'Escape':      if (current) stop(); break;
        case 'n': case 'N': if (current || queue.length) advance(); break;
        case 'ArrowUp':     e.preventDefault(); setVolume(+$('vol').value + 5); break;
        case 'ArrowDown':   e.preventDefault(); setVolume(+$('vol').value - 5); break;
        case 't': case 'T': $('tuneBtn').click(); break;
        case '[':           applyNudge(-0.1); break;
        case ']':           applyNudge(0.1); break;
        case 'f': case 'F': toggleFullscreen(); break;
        case '/':           e.preventDefault(); $('search').focus(); break;
      }
    });

    /* ---------- startup ---------- */
    try {
      var savedVol = localStorage.getItem(VOL_KEY);
      if (savedVol !== null) $('vol').value = savedVol;
    } catch (err) {}
    setVolume(+$('vol').value);
    restoreQueue();
  </script>
</body>
</html>
